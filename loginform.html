<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Form</title>
<style>
body { font-family: Arial, sans-serif; background-color: #f2f2f2; }
form { border: 3px solid #f1f1f1; max-width: 300px; margin: auto; background: #fff; padding: 16px; }
input[type=text], input[type=password] {
width: 100%; padding: 12px; margin: 8px 0;
border: 1px solid #ccc; box-sizing: border-box;
}
button {
background-color: #04AA6D; color: white;
padding: 14px; border: none; cursor: pointer; width: 100%;
}
button:hover { opacity: 0.8; }
.container { padding: 16px; }
.psw { float: right; padding-top: 16px; font-size: 12px; }
@media screen and (max-width: 300px) {
.psw { display: block; float: none; }
}
</style>
</head>
<body>

<h2 style="text-align:center;">Login Form</h2>

<form action="/login" method="post">
<div class="container">
<label for="uname"><b>Username</b></label>
<input type="text" placeholder="Enter Username" name="uname" required autocomplete="username">

<label for="psw"><b>Password</b></label>
<input type="password" placeholder="Enter Password" name="psw" required autocomplete="current-password">

<button type="submit">Login</button>
<label><input type="checkbox" name="remember"> Remember me</label>
<span class="psw">Forgot <a href="#">password?</a></span>
</div>
</form>

</body>
</html>
